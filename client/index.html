
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
</head>
<body class="game-page">

    <header class="game-header">
        <h1>🍌 Banana Game</h1>
        <div>
            <span id="username">Player</span>
            <button id="logoutButton">Log Out</button>
        </div>
    </header>

    <main class="game-container">

        <section class="game-card">
            <h2>Welcome to Banana Game!</h2>
            <p>Solve the puzzle and test your skills.</p>

            <div id="game-area">
                <p id="game-message" aria-live="polite">Ready to play?</p>

                <button id="startButton">Start Game</button>

                <div id="puzzle-area" hidden>
                    <div id="timer" class="timer" role="timer" aria-live="off">Time: 30s</div>

                    <img id="puzzleImage" src="" width="660" height="360" alt="Banana puzzle">

                    <form id="answerForm">
                        <label for="answer">Your Answer</label>
                        <input
                            type="number"
                            id="answer"
                            placeholder="Enter your answer"
                            required
                        >
                        <button type="submit">Submit Answer</button>
                    </form>

                    <div class="solution-section">
                        <button type="button" id="solutionButton" class="btn-secondary">
                            Show Solution
                        </button>
                        <p id="solutionMessage" aria-live="polite"></p>
                    </div>
                </div>

                <p id="resultMessage" aria-live="polite"></p>
            </div>
        </section>

        <section class="score-card">
            <h2>Your Score</h2>
            <p class="score-label">Total Score</p>
            <p id="score">0</p>
            <p class="score-sublabel">points</p>
        </section>

        <section class="leaderboard-card">
            <h2>Global Leaderboard</h2>
            <p>Top 10 Players</p>

            <div id="leaderboard">
                <p>Loading leaderboard...</p>
            </div>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
